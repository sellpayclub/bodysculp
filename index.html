<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script>
    try {
      const desc = Object.getOwnPropertyDescriptor(window, 'fetch');
      if (desc && !desc.set) {
        let originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return originalFetch; },
          set: function(val) { originalFetch = val; },
          configurable: true,
          enumerable: true
        });
      }
    } catch (e) {
      console.warn("Could not patch window.fetch", e);
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protocolo e Solução Exclusiva</title>
  
  <!-- Custom Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen">

  <!-- Main mounting node for active funnels -->
  <div id="root"></div>

  <!-- Vite script entrypoint -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
