<style id="results-layout-fix">
.results-grid { width:100%; min-width:0; grid-template-columns:minmax(0,1fr); }
.results-grid > div { width:100%; min-width:0; max-width:100%; overflow:hidden; }
.results-grid .animate-marquee-left { align-items:center; gap:8px; }
.results-grid .animate-marquee-left > div { width:auto; flex-shrink:0; }
.results-grid .animate-marquee-left img { display:block; height:240px; width:auto; max-width:none; object-fit:contain; }
@media(max-width:480px) { .results-grid .animate-marquee-left img { height:192px; } }
</style>
<style id="technologies-style">
.technologies-section{min-width:0;padding:24px 20px;background:#fff;border:1px solid #f0e5e9;border-radius:28px;overflow:hidden}
.technologies-section h2{font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.025em;margin:0 0 20px;color:#18181b}
.technology-copy{font-size:16px;line-height:1.65;color:#52525b;margin:0}
.technology-step{padding-top:28px;margin-top:28px;border-top:1px solid #f0e5e9}
.technology-step h3{font-size:20px;line-height:1.3;font-weight:700;margin:0 0 18px;color:#18181b}
.technology-step video{display:block;width:100%;height:auto;max-height:380px;object-fit:contain;border-radius:18px;background:#fafafa;margin:0 0 20px}
.technology-summary{margin-top:28px;padding:22px 18px;background:#fff1f2;border-radius:20px}
.technology-secret{font-size:19px;font-weight:700;color:#18181b;margin:20px 0}
.technology-origin{font-size:14px;line-height:1.5;font-weight:800;color:#be123c;margin:0}
</style>
<style>
.quiz-proof{display:grid;gap:10px;margin:0 -12px 28px;min-width:0}
.quiz-proof-window{overflow:hidden;border-radius:16px;background:white}
.quiz-proof-track{display:flex;width:max-content;animation:quiz-proof-scroll 38s linear infinite}
.quiz-proof-group{display:flex;gap:8px;padding-right:8px;flex-shrink:0;align-items:center}
.quiz-proof-group img{display:block;height:144px;width:auto;max-width:none;flex-shrink:0;border-radius:12px;object-fit:contain}
@keyframes quiz-proof-scroll{to{transform:translateX(-50%)}}
.quiz-proof-window:hover .quiz-proof-track{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.quiz-proof-track{animation:none}.quiz-proof-window{overflow-x:auto}.quiz-proof-group[aria-hidden=true]{display:none}}
